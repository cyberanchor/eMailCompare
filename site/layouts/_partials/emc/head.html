{{- /* Stylesheet and script of the components, minified and fingerprinted. */ -}}
{{- $style := resources.Get "emc/emc.css" | resources.Copy "css/emc.css" | minify | fingerprint -}}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
{{- $js := resources.Get "emc/emc.js" | js.Build (dict "minify" true "target" "es2018") | fingerprint -}}
<script defer src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}"></script>
