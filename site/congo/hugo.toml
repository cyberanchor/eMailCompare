# Congo prototype: https://github.com/jpanther/congo
baseURL = "https://cyberanchor.github.io/eMailCompare/site/congo/public/"
title = "eMailCompare"
locale = "en"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT"]

[outputs]
  home = ["HTML", "JSON"]

[params]
  description = "Yet another email service comparison: who runs each provider, where its servers are, and what it asks for."
  colorScheme = "congo"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = false
  [params.header]
    layout = "basic"
    showTitle = true
  [params.footer]
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true
  [params.homepage]
    layout = "custom"
    showRecent = false
  [params.article]
    showDate = false
    showAuthor = false
    showBreadcrumbs = true
    showReadingTime = false
    showPagination = false
  [params.list]
    showBreadcrumbs = true
  [params.emc.pageParams]
    showBreadcrumbs = true

[[menu.main]]
  name = "Providers"
  pageRef = "/providers"
  weight = 10
[[menu.main]]
  name = "Methodology"
  pageRef = "/about"
  weight = 20
[[menu.main]]
  identifier = "github"
  url = "https://github.com/cyberanchor/eMailCompare"
  weight = 30
  [menu.main.params]
    icon = "github"

# Provider pages carry their (already escaped) text as HTML.
[security]
  allowContent = ["! ^text/org$"]

[[module.imports]]
  path = "congo"

# Shared eMailCompare components and the data files from the repository root.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "../_shared/content"
  target = "content"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "../_shared/layouts"
  target = "layouts"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "../_shared/assets"
  target = "assets"
[[module.mounts]]
  source = "../.."
  target = "assets/emc"
  files = ["emails.csv", "README.md"]
