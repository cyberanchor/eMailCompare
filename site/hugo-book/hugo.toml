# hugo-book prototype: https://github.com/alex-shpak/hugo-book
baseURL = "https://cyberanchor.github.io/eMailCompare/site/hugo-book/public/"
title = "eMailCompare"
locale = "en"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT"]
enableRobotsTXT = false

[params]
  BookTheme = "auto"
  BookSection = "/"
  BookToC = false
  BookSearch = true
  BookRepo = "https://github.com/cyberanchor/eMailCompare"
  BookDateFormat = "2006-01-02"

# Providers stay out of the sidebar (228 links on every page); the table and search find them.
[params.emc.pageParams]
  bookHidden = true

# Provider pages carry their (already escaped) text as HTML.
[security]
  allowContent = ["! ^text/org$"]

[markup.goldmark.renderer]
  unsafe = false

# The theme, without the mermaid / KaTeX / asciinema files this site does not use.
[[module.imports]]
  path = "hugo-book"
  [[module.imports.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.imports.mounts]]
    source = "assets"
    target = "assets"
  [[module.imports.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.imports.mounts]]
    source = "static"
    target = "static"
    files = ["favicon.*", "minisearch.min.js"]

# Shared eMailCompare components and the data files from the repository root.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "../_shared/content"
  target = "content"
[[module.mounts]]
  source = "layouts"
  target = "layouts"
[[module.mounts]]
  source = "../_shared/layouts"
  target = "layouts"
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "../_shared/assets"
  target = "assets"
[[module.mounts]]
  source = "../.."
  target = "assets/emc"
  files = ["emails.csv", "README.md"]
