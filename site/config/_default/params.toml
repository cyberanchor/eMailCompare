env = "production"
description = "Yet another email service comparison: who runs each provider, where its servers are, which intelligence alliance that country belongs to, and what it asks for."
defaultTheme = "auto"
ShowBreadCrumbs = true
ShowReadingTime = false
ShowPostNavLinks = false
ShowCodeCopyButtons = false
disableSpecial1stPost = true

[assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon.svg"
  favicon32x32 = "favicon.svg"
  apple_touch_icon = "favicon.svg"
  safari_pinned_tab = "favicon.svg"

[[socialIcons]]
  name = "github"
  url = "https://github.com/cyberanchor/eMailCompare"

# eMailCompare components
[emc]
  variant = "paper"   # assets/emc/variants/<variant>.css
  list = "table"      # table | cards
  hero = "center"     # center | left | split | masthead | terminal
  gallery = "https://cyberanchor.github.io/eMailCompare/site/"
  # Extra front matter for every provider page (the pages come from content/providers/_content.gotmpl).
  [emc.pageParams]
    ShowBreadCrumbs = true
