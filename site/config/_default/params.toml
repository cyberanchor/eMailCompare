env = "production"
description = "Yet Another Email Service Comparison: who runs each email provider, where its servers are, which intelligence alliance that country belongs to, and what it asks for at signup."
defaultTheme = "dark"      # dark | light | auto; the header button switches and remembers the choice
disableThemeToggle = false
ShowBreadCrumbs = false
ShowReadingTime = false
ShowPostNavLinks = false
ShowCodeCopyButtons = false
disableSpecial1stPost = true

[assets]
  favicon = "favicon.svg"
  favicon16x16 = "favicon.svg"
  favicon32x32 = "favicon.svg"
  apple_touch_icon = "favicon.svg"
  safari_pinned_tab = "favicon.svg"

# eMailCompare components
[emc]
  repo = "https://github.com/cyberanchor/eMailCompare"   # the logo in the header links here

[footer]
  text = "data: [emails.csv](https://github.com/cyberanchor/eMailCompare/blob/main/emails.csv) · [source on GitHub](https://github.com/cyberanchor/eMailCompare)"
