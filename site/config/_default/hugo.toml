# eMailCompare on Hugo + PaperMod (terminal design). Build with ./build.sh; the site goes to public/.
baseURL = "https://cyberanchor.github.io/eMailCompare/site/public/"
title = "eMailCompare"
locale = "en"
theme = "PaperMod"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT"]
publishDir = "public"

# Provider pages carry their (already escaped) text as HTML.
[security]
  allowContent = ["! ^text/org$"]

[markup.goldmark.renderer]
  unsafe = false

[[module.mounts]]
  source = "assets"
  target = "assets"
# Provider records from the repository root: ../data/providers/<domain>.yaml -> hugo.Data.providers
[[module.mounts]]
  source = "../data/providers"
  target = "data/providers"
