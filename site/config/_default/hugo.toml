# eMailCompare on Hugo + PaperMod (terminal design). Build with ./build.sh; the site goes to public/.
baseURL = "https://cyberanchor.github.io/eMailCompare/site/public/"
title = "eMailCompare"
locale = "en"
theme = "PaperMod"
disableKinds = ["taxonomy", "term", "rss", "sitemap", "robotsTXT"]
publishDir = "public"

# Provider pages carry their (already escaped) text as HTML.
[security]
  allowContent = ["! ^text/org$"]

[markup.goldmark.renderer]
  unsafe = false

# Data files from the repository root: the providers and the status marks of the README tables.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = ".."
  target = "assets/emc"
  files = ["emails.csv", "README.md"]
