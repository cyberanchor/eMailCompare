note: '### Description of Disroot Email in English  **Disroot** is a platform provided by the non-profit organization Stichting Disroot.org (Netherlands), featuring an email service (https://webmail.disroot.org) among other tools for communication and collaboration. Disroot focuses on privacy, freedom, and ethical use of technology based on free and open-source software.  **Security & Anonymity:** Disroot offers a high level of privacy through minimal data collection and a strict protection policy. Account creation requires only a temporary email (deleted after approval unless kept for recovery), a username, and a password. Activity logs (IP, actions) are stored for just 24 hours and not archived, minimizing traces. Emails are stored on servers in the Netherlands unencrypted by default, but users can apply GnuPG/PGP for end-to-end encryption. Data transmission is secured with SSL/TLS, and servers use disk encryption. Data isn’t sold or shared with third parties, except as required by federated services (e.g., sending an email to Gmail reveals the recipient’s address). Full anonymity isn’t guaranteed due to email’s federated nature and lack of built-in encryption—using VPN/Tor and self-encrypting emails is recommended for maximum protection. Losing a password results in irreversible access loss, as Disroot doesn’t hold master keys.  **Use Cases:** Disroot is suitable for users who value privacy, free speech, and a non-commercial approach to technology. It’s a good fit for: - Ethical correspondence with minimal tracking (especially with PGP encryption). - Activists, communities, or individuals avoiding corporate ecosystems and ads. - Those wanting to integrate email with other open services (Nextcloud, XMPP). It’s not suitable for commercial purposes (strictly prohibited), highly sensitive data without encryption, or users needing simplicity (requires technical awareness for optimal security). Disroot is ideal for open-source enthusiasts, small groups, or those willing to take security into their own hands within Dutch jurisdiction and GDPR compliance.'
