note: 'CodaMail is an email service provided by Packetderm, LLC (USA, Massachusetts), also known through Cotse.Net, with a strong focus on safeguarding user privacy. Accessible via https://codamail.com, CodaMail combines minimal data collection with robust encryption, offering a secure communication solution centered on privacy and user control.  Security & Anonymity: CodaMail ensures a high level of privacy through strict principles: it collects only the bare minimum of data (account name, subscription details, creation/expiration dates), and email content is individually encrypted at rest using elliptic-curve AES-GCM-256. It supports zero-access automatic PGP encryption and end-to-end encryption via PGP, making message content inaccessible even to the service operators. Server logs are retained for just 5 days for technical operations and abuse prevention, and no IP addresses are stored for VPN/proxy services, though Intrusion Detection may capture IPs during anomalies. Registration requires only a username and password (hashed with SHA512/yescrypt), with 2FA (TOTP) available for added security. However, CodaMail isn’t fully anonymous—payments (via First Data/PayPal or cash) and U.S. jurisdiction may link a payer’s identity. Data isn’t sold or shared with third parties, except under valid U.S. legal requests (reviewed and challenged if overly broad, with user notification when allowed). For complete anonymity, using Tor and avoiding payment ties to real identity are recommended.  Use Cases: CodaMail is suitable for users who prioritize private correspondence with strong encryption and minimal data collection. It’s an excellent choice for:      Confidential communication using PGP (e.g., between tech-savvy users).     Individuals avoiding tracking by advertisers or analytics (no logs or tracking).     Those wanting control over access and encryption (e.g., via IMAP/POP3 settings and PGP keys). It’s not ideal for total anonymity (due to payments and U.S. jurisdiction) or bulk messaging (strict anti-spam measures). CodaMail is perfect for those who value security and are willing to manage their own keys and backups (no automatic backups to protect privacy), including professionals, privacy-conscious users, or small businesses needing secure email within the U.S. legal framework.'
