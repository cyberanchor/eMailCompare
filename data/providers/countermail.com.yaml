note: 'Auto-collected 2026-11-18 (DNS, RDAP/whois, website, support knowledge base); registration not tested, because it is closed. The site and the registration page say the service is closed for new registrations; signup asks for a 32-character invitation code from an existing premium member (required since 2020-11-01), then a 10-day trial. Swedish service: the site says the company is based in Sweden and follows Swedish law, but publishes no company name or registration number, and none was found, so the owner is left empty. Domain registration dates from 2008-05-11, but the Wayback Machine has captures since 2002-09-21: the domain was registered before, possibly by someone else. OpenPGP with 4096-bit keys, encrypted in the browser; mail body and attachments are stored encrypted, headers (From, To, Subject, Date) and folder names are not. Private keys are stored encrypted on the server, not linked to the account according to the site; a lost password cannot be recovered. Webmail built on Roundcube and OpenPGP.js. Also IMAP, own domains ($15 once), aliases, USB key option, secure forms, XMPP chat, extra storage from $19 for 250 MB. Court orders (support FAQ): only from Swedish police with a prosecutor''s decision, reviewed by the company''s lawyer, metadata at most, and the account may be closed; spam, phishing and ransomware accounts are closed without such a decision. Website behind Cloudflare; webmail, support, IMAP and MX are all on one address, 5.226.34.35 (Adminor, Sweden). Inconsistencies on the site: the services page lists prices, while the changelog of 2025-11-06 says the service has been ''100% free for over 1.5 years''; the home page offers a one-week free trial and signup, while registration is closed and the trial is 10 days by invitation; the terms and services page still list Bitcoin, while the changelog says Bitcoin was disabled for new accounts on 2024-06-19 and all crypto payments would end that year; the privacy policy says no cookies, while the webmail sets a session cookie (roundcube_sessid); the site calls the web servers diskless and separate from the mail servers, which cannot be confirmed from outside, since both answer on the same address. The webmail server reports Apache 2.4.6, PHP 5.4.16 and OpenSSL 1.0.2k, CentOS 7 era versions (backported fixes cannot be seen from outside). IMAP server imap.countermail.com:993 answers (Dovecot); SMTP ports 465 and 587 were not reachable from the test network. Mail DNS: SPF ~all, DMARC p=quarantine, DNSSEC and DANE; no MTA-STS or TLS-RPT.'
