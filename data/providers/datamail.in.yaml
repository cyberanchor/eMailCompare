note: 'Datamail is an email service provided by the Indian company Data Xgen Technologies Pvt Ltd, launched as part of a digital initiative. It offers free email accounts with the @datamail.in domain, accessible via a web interface and mobile application. The service supports contact synchronization, basic communication features, and integration with advertising services. To register, you must install the official Datamail app on your phone (available for Android and iOS), tying the process to a mobile device. Security & Anonymity: Datamail employs SSL encryption to secure data transmission and provides two-factor authentication (2FA) to enhance login security. However, it lacks end-to-end encryption, meaning email content remains accessible to the company as data is stored unencrypted on servers. Anonymity is minimal: registration via the app requires personal details (name, email, phone number, sometimes credit card), alongside device information (model, OS, IP, identifiers) and usage data (logs, queries, contacts). This data may be shared with partners (e.g., advertisers) or authorities upon request, with servers located across multiple countries, reducing privacy control. The privacy policy (last updated December 22, 2016) emphasizes personalization over anonymity. Datamail is suitable for basic communication, sending emails, syncing contacts, or registering on websites where high privacy isn’t a priority. The mobile app makes it convenient for phone-based users, particularly in India, where it’s promoted as a local alternative. However, due to weak anonymity, lack of end-to-end encryption, and extensive data collection, it’s not recommended for confidential correspondence or scenarios requiring identity protection (unlike Proton Mail or Tutanota). It’s a general-purpose tool for everyday tasks with moderate security, aimed at mainstream users.'
