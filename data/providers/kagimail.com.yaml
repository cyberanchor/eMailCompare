note: 'Auto-collected 2026-11-09 (DNS, RDAP/whois, website, Kagi Mail FAQ at help.kagi.com/kagi/mail/); registration not tested. Email service of Kagi Inc. (Kagi search, Orion browser), a Delaware public benefit corporation with a mailing address in San Francisco; terms under Delaware law. kagimail.com redirects to the Kagi account login (account.kagi.com): signup creates a @kagimail.com address or uses an existing email; login also with Apple, Google, Microsoft or GitHub. The signup page says free during beta, no payment information required; the Kagi Mail FAQ still describes an alpha for Distinguished Members of the Kagi community with beta access sent in waves, and kagi.com lists Kagi Mail as coming soon. Pricing not final (premium, not ad-supported). Mail server Stalwart (open source); the webmail is Kagi''s own, built on JMAP, closed source. IMAP, SMTP, JMAP and Sieve; no mobile app yet. No end-to-end encryption (the FAQ suggests a client such as Thunderbird); remote images are proxied and most tracking pixels stripped. Random aliases on @kagimail.com, custom domains with their own aliases, MBOX and IMAP import (IMAP import stores the other account''s password encrypted). Opt-in LLM-based mail rules and assistant@kagimail.com (Kagi Assistant by email). The privacy policy covers all Kagi services and has a warrant canary. Web and mail servers on Google Cloud (AS396982), DNS on Cloudflare. IMAP server mail.kagimail.com:993 answers (Stalwart). Publishes mail client autoconfig and SRV records (IMAP, submission, JMAP). Mail DNS: SPF -all, DMARC p=reject, MTA-STS (testing mode), TLS-RPT, DNSSEC.'
